<style>
:root{
  --bg:#F4F6F3;--card:#FFFFFF;--ink:#17201B;--ink2:#2B352F;--muted:#5B655F;--line:#E1E6E2;
  --green:#2F7D5B;--green-d:#1F5A40;--green-l:#E3EEE8;--orange:#C2581A;--orange-l:#FBE9DD;
  --blue-l:#DCEBF5;--blue-d:#1D4E73;--yellow-l:#FFF3D6;--yellow-d:#6B4A00;--violet-l:#ECEAF4;--violet-d:#433A73;
}
*{box-sizing:border-box}
html,body{touch-action:manipulation;margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font:inherit;color:inherit;touch-action:manipulation}
*{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)) 16px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.top small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.top h1{font-size:26px;font-weight:700;line-height:1.15}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--green-l);color:var(--green-d);white-space:nowrap}
.pill.o{background:var(--orange-l);color:#8A3A0E}.pill.b{background:var(--blue-l);color:var(--blue-d)}.pill.y{background:var(--yellow-l);color:var(--yellow-d)}.pill.v{background:var(--violet-l);color:var(--violet-d)}.pill.g{background:#ECEFED;color:var(--ink2)}
.card{background:var(--card);border-radius:20px;padding:16px;border:1px solid #E6EAE6;box-shadow:0 1px 3px rgba(23,32,27,.05)}
.hero{background:#1E4D3A;color:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero .mut,.hero small{color:#BFD8CB}
.hero h1{font-size:26px;color:#fff}
.hero .bar{background:#2E6A51}.hero .bar>i{background:#F2CE6B}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.ring-num{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;fill:#fff}
.ring-lab{font-size:9px;fill:#BFD8CB;font-weight:600;letter-spacing:.05em}
.mc{display:flex;flex-direction:column;gap:10px}
.mc-head{display:flex;align-items:center;gap:12px}
.slotico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.slotico svg{width:20px;height:20px}
.mc-when{display:flex;flex-direction:column;flex:1;min-width:0}
.mc-when b{font-size:15px}
.checkbtn{width:44px;height:44px;border-radius:50%;border:2px solid #C9D3CD;background:#fff;color:#C9D3CD;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.checkbtn.on{background:var(--green);border-color:var(--green);color:#fff}
.mc-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.linkbtn{border:0;background:none;color:var(--green-d);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:40px;cursor:pointer;padding:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;font-weight:600;cursor:pointer}
.stepper b{font-family:'Space Grotesk',sans-serif;font-size:24px;min-width:28px;text-align:center}
.drink{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:#DCE3DE}
.dots i.on{background:#6FA8DC}
.dots i.over{background:var(--orange)}
.seg5 .opt{font-size:12px;padding:6px 2px}
.dark{background:var(--ink);color:#fff}
.dark .mut{color:#C9D3CD}
.mut{color:var(--muted)}
.lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dark .lab{color:#C9D3CD}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.bar{height:8px;background:#33403A;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:#5FBF8F;border-radius:999px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.sec h2{font-size:18px;font-weight:600}
.meal{display:flex;flex-direction:column;gap:8px;cursor:pointer;border:0;text-align:left;width:100%}
.meal .dish{font-size:16px;font-weight:600;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:500;padding:4px 9px;border-radius:999px}
.p{background:var(--orange-l);color:#8A3A0E}.c{background:var(--yellow-l);color:var(--yellow-d)}.v{background:var(--green-l);color:var(--green-d)}.f{background:var(--violet-l);color:var(--violet-d)}.x{background:#ECEFED;color:var(--ink2)}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;min-height:50px;border-radius:14px;border:0;font-weight:700;font-size:16px;cursor:pointer;padding:0 16px;width:100%}
.btn.pri{background:var(--green);color:#fff}.btn.hot{background:var(--orange);color:#fff}.btn.sec2{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.sm{min-height:44px;font-size:14px;width:auto}
.seg{display:grid;gap:6px}
.opt{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:600;padding:6px 8px}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.on.or{background:var(--orange);border-color:var(--orange)}
.opt.on.gr{background:var(--green-l);color:var(--green-d);border-color:var(--green)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom)) 4px;z-index:20}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);min-height:52px;justify-content:center;cursor:pointer}
.tab svg{width:22px;height:22px;padding:4px 14px;box-sizing:content-box;border-radius:999px}
.tab.on{color:var(--green-d);font-weight:700}
.tab.on svg{background:var(--green-l)}
.sheet-bg{position:fixed;inset:0;background:rgba(23,32,27,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:9px;background:#C9D3CD;margin:0 auto 4px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
ul.clean{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.clean li{font-size:14px;line-height:1.45;display:flex;gap:8px}
.ing{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing b{font-weight:600}
.ing span{color:var(--muted);text-align:right}
input,textarea,select{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{border:0;border-radius:12px;background:var(--card);min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:4px 0}
.day b{font-size:13px}.day small{font-size:10px;font-weight:600}
.day.on{outline:2px solid var(--ink)}
.day.pool{background:var(--blue-l);color:var(--blue-d)}
.day.pz{background:var(--orange);color:#fff}
.tip{background:var(--green-l);color:var(--green-d);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;display:flex;gap:10px}
.tip.o{background:var(--orange-l);color:#7A320B}
.tip svg{flex-shrink:0;margin-top:1px}
.bigtimer{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;text-align:center}
.small{font-size:12px}
.shop-item{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;border-bottom:1px solid var(--line);cursor:pointer}
.shop-item:last-child{border-bottom:0}
.shop-item input{width:22px;height:22px;flex-shrink:0}
.shop-item.done span{text-decoration:line-through;color:var(--muted)}
.ai-out{white-space:pre-line;font-size:14px;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}
.hbars{display:grid;gap:6px;align-items:end;height:80px}
.hbars i{display:block;background:#C9D3CD;border-radius:6px;min-height:3px}
.hbars i.hi{background:var(--orange)}
.hlabels{display:grid;gap:6px;font-size:10px;color:var(--muted);text-align:center}
a{color:var(--green)}
.hidden{display:none!important}
#print{display:none}
@media print{ body>*:not(#print){display:none!important} #print{display:block!important;padding:10mm} body{background:#fff} }
</style>

<script>
(function(){
'use strict';

/* ---------------- Niente zoom (doppio tocco e pizzico) ---------------- */
(function(){
  let last = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    const t = e.target;
    const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
    if (!typing && now - last < 350) e.preventDefault();
    last = now;
  }, { passive: false });
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){ document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive: false }); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive: false });
})();

/* ---------------- Utility ---------------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => (n < 10 ? '0' : '') + n;
const keyOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dow = (d) => (d.getDay() + 6) % 7; // 0 = lunedì
const mondayOf = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -dow(x)); };
const GIORNI = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const GG = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];

function rng(seed){ let a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, seed){ const r = rng(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

*/

const SLOTS = ['col','spu','pra','mer','cen','ser'];
const SLOTNAME = { col:'Colazione', spu:'Spuntino', pra:'Pranzo', mer:'Merenda', cen:'Cena', ser:'Fine serata' };
function activeSlots(){ return S.profilo.spuntino === false ? SLOTS.filter(x => x !== 'spu') : SLOTS; }
function weekIndex(monday){ return Math.round((monday - mondayOf(parseKey('2026-11-16'))) / (7 * 864e5)); }
function pizzaDayFor(monday){ const k = keyOf(monday); return (S.pizzaSettimana[k] != null) ? S.pizzaSettimana[k] : S.profilo.pizzaDay; }
const planCache = {};
function basePlan(monday){
  const mk = keyOf(monday) + '|' + pizzaDayFor(monday) + '|' + Object.keys(S.escl || {}).sort().join(',') + '|' + Object.keys(S.pref || {}).sort().join(',');
  if (planCache[mk]) return planCache[mk];
  const w = weekIndex(monday), seed = 1000 + w * 7919;
  const pz = pizzaDayFor(monday);
  const pattern = shuffle(['pesce','legumi','carne','pesce','uova','legumi','carne'], seed);
  // categorie con ricette
  const dinnersByCat = {};
  byType('cen').forEach(k => { const c = R[k].cat; (dinnersByCat[c] = dinnersByCat[c] || []).push(k); });
  ['veg','formaggio'].forEach(c => { (dinnersByCat[c] || []).forEach(k => (dinnersByCat.uova = dinnersByCat.uova || []).push(k)); });
  const used = new Set();
  const days = [];
  const lunches = favFirst(byType('pra'), seed + 3);
  const cols = shuffle(byType('col'), seed + 5);
  const mers = shuffle(byType('mer'), seed + 7);
  const spms = shuffle(byType('spm'), seed + 13);
  const pres = shuffle(byType('pre'), seed + 9);
  const sers = shuffle(byType('ser'), seed + 11);
  let li = 0;
  const catCount = {};
  for (let i = 0; i < 7; i++) {
    let cen;
    if (i === pz) cen = 'dpz';
    else {
      const cat = pattern[i];
      const list = favFirst(dinnersByCat[cat] || [], seed + i * 13 + (catCount[cat] || 0));
      cen = list.find(k => !used.has(k)) || list[0];
      catCount[cat] = (catCount[cat] || 0) + 1;
    }
    used.add(cen);
    let pra;
    if (i === pz) pra = 'lpz';
    else {
      const dc = R[cen].cat;
      for (let t = 0; t < lunches.length; t++) {
        const cand = lunches[(li + t) % lunches.length];
        if (R[cand].cat !== dc && !used.has(cand)) { pra = cand; li = (li + t + 1) % lunches.length; break; }
      }
      if (!pra) { pra = lunches[li % lunches.length]; li++; }
    }
    used.add(pra);
    const pool = S.profilo.piscina.includes(i);
    days.push({ col: cols[i % cols.length], spu: spms[i % spms.length], pra, mer: pool ? pres[i % pres.length] : (i === pz ? 'm1' : mers[i % mers.length]), cen, ser: sers[i % sers.length] });
  }
  planCache[mk] = days;
  return days;
}
function mealsFor(date){
  const monday = mondayOf(date), i = dow(date), k = keyOf(date);
  const base = basePlan(monday)[i];
  const out = {};
  SLOTS.forEach(s => { out[s] = S.swaps[k + ':' + s] || base[s]; });
  const fe = S.feste[k];
  if (fe === 'pranzo') { out.pra = 'ffe'; out.cen = 'fle'; out.mer = 'm1'; out.ser = 's3'; }
  if (fe === 'cena') { out.cen = 'ffe'; out.pra = 'fle'; out.mer = 'm1'; out.ser = 's3'; }
  return out;
}
function festaSeg(k){
  const fe = S.feste[k] || '';
  let h = '<div class="card stack"><span class="lab">Giorno di festa?</span><div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))">';
  [['','No'],['pranzo','Pranzo grande'],['cena','Cena grande']].forEach(([v, l]) => { h += '<button class="opt' + (fe === v ? (v ? ' on or' : ' on') : '') + '" data-festa="' + v + '" data-day="' + k + '">' + l + '</button>'; });

}
function isFeste(d){ const m = d.getMonth(), g = d.getDate(); return (m === 11 && g >= 20) || (m === 0 && g <= 6); }
function weekUsed(monday){
  const set = new Set();
  for (let i = 0; i < 7; i++) { const m = mealsFor(addDays(monday, i)); SLOTS.forEach(s => set.add(m[s])); }
  return set;
}
function swapMeal(date, slot){
  const k = keyOf(date), cur = mealsFor(date)[slot];
  if (cur === 'dpz') { toast('La pizza si sposta da "Settimana".'); return; }
  const t = R[cur].t;
  const pool = t === 'pra' ? byType('pra') : t === 'cen' ? byType('cen') : byType(t);
  const used = weekUsed(mondayOf(date));
  const start = pool.indexOf(cur);
  if (pool.length < 2) { toast('Non ci sono alternative per questo pasto'); return; }
  let pick = null;
  for (let n = 1; n < pool.length; n++) { const cand = pool[(start + n + pool.length) % pool.length]; if (cand !== cur && !used.has(cand)) { pick = cand; break; } }
  if (!pick) pick = pool[(start + 1 + pool.length) % pool.length];
  if (pick === cur) pick = pool.find(x => x !== cur);
  S.swaps[k + ':' + slot] = pick;
  save();
}

function panciaAnalysis(){
  const keys = Object.keys(S.pancia).sort().slice(-42);
  if (keys.length < 7) return { n: keys.length, top: [] };
  const res = CAUSE.map(c => {
    const withC = keys.filter(k => (S.pancia[k].c || []).includes(c)), without = keys.filter(k => !(S.pancia[k].c || []).includes(c));
    if (withC.length < 2 || !without.length) return null;
    const avg = (arr) => arr.reduce((a, k) => a + S.pancia[k].v, 0) / arr.length;
    return { c, diff: avg(withC) - avg(without), n: withC.length };
  }).filter(x => x && x.diff >= 0.4).sort((a, b) => b.diff - a.diff);
  return { n: keys.length, top: res.slice(0, 2) };
}

const canonCache = {};
function canonOf(name){
  if (canonCache[name]) return canonCache[name];
  const n = name.toLowerCase();
  let out = CANON.filter(c => c[2].test(n)).map(c => c[0]);
  if (/gallett/.test(n)) out = ['Gallette'];
  if (/pane in cassetta|fette biscottate/.test(n)) out = out.filter(x => x !== 'Pane' || /pane in cassetta/.test(n));
  if (/frutto|frutta/.test(n) && !/secca/.test(n)) out = out.filter(x => x === 'Frutta di stagione');
  return (canonCache[name] = out.length ? out : [shortName(name)]);
}
function catalogo(){
  const out = {};
  CANON.forEach(c => { out[c[0]] = c[1]; });
  return out;
}
function recipeCanon(id){
  const set = new Set();
  (R[id] ? R[id].i : []).forEach(x => canonOf(x[0]).forEach(c => set.add(c)));
  set.delete('Olio extravergine'); set.delete('Spezie (curry, cannella, paprika)');
  return [...set];
}
function haveScore(id){
  const ings = recipeCanon(id);
  if (!ings.length) return 0;
  const have = ings.filter(n => S.casa[n]).length, miss = ings.length - have;
  return have ? (miss === 0 ? 100 : 0) + have * 3 - miss : 0;
}
function missingOf(id){ return recipeCanon(id).filter(n => !S.casa[n] && !['Limone','Aglio e prezzemolo','Tisane'].includes(n)); }
function availChip(id){
  if (!casaCount() || !R[id] || !R[id].i.length) return '';

}

const NO_SOST = /salsicc|wurstel|pancett|guancial|salame|mortadell|panna|burro|maionese|strutto|fritt|impanat|nutella|crem[ae] spalmabil|zucchero|bibit|cotechino|lardo|speck/;
function gruppiOf(canon){ return GRUPPI.filter(g => g.k.includes(canon)); }
function judgeSwap(orig, nuovo){
  const t = nuovo.toLowerCase().trim();
  const co = canonOf(orig), cn = CANON.filter(c => c[2].test(t)).map(c => c[0]);
  if (NO_SOST.test(t)) {
    const g = co.map(gruppiOf).flat().sort((x, y) => y.k.length - x.k.length)[0];
    return { ok:false, txt:'Meglio di no: è un alimento ricco di grassi saturi o di sale e pesa sul colesterolo.' + (g ? ' Al posto di ' + orig.toLowerCase() + ' puoi usare: ' + g.k.filter(x => !co.includes(x)).slice(0, 4).join(', ').toLowerCase() + '.' : '') };
  }
  if (!cn.length) return null;
  if (cn.some(x => co.includes(x))) return { ok:true, txt:'Sì, è lo stesso ingrediente: va benissimo.' };
  for (const a of co) for (const b of cn) {
    const g = GRUPPI.find(gr => gr.k.includes(a) && gr.k.includes(b));
    if (g) {
      let extra = '';
      if (b === 'Patate') extra = ' Le patate: 2 medie al posto di un pugno di pasta o 6 cucchiai di riso.';
      if (b === 'Salmone') extra = ' Il salmone è più grasso: palmo un po\' più piccolo.';
      if (b === 'Manzo magro') extra = ' Ricorda: carne rossa massimo una volta a settimana.';
      if (S.profilo.compagnaCeliaca && ['Cous cous','Farro','Orzo','Pane','Piadina','Fette biscottate','Cracker','Pasta','Spaghetti'].includes(b)) extra += ' Se mangia anche lei: ' + b.toLowerCase() + ' contiene glutine, prendi la versione senza glutine.';
      return { ok:true, txt:'Sì, va bene: ' + b.toLowerCase() + ' al posto di ' + a.toLowerCase() + ' (' + g.n + ').' + (b === 'Patate' ? '' : ' ' + g.nota.charAt(0).toUpperCase() + g.nota.slice(1) + '.') + extra };
    }
  }
  const ga = co.map(gruppiOf).flat()[0], gb = cn.map(gruppiOf).flat()[0];
  return { ok:false, txt:'Non è una sostituzione equivalente: ' + orig.toLowerCase() + (ga ? ' fa parte di ' + ga.n : '') + ', ' + nuovo.toLowerCase() + (gb ? ' di ' + gb.n : '') + ', e cambia l\'equilibrio del piatto.' + (ga ? ' Scegli piuttosto tra: ' + ga.k.filter(x => !co.includes(x)).slice(0, 4).join(', ').toLowerCase() + '.' : ''), dubbio:true };
}

function planFromCasa(days){

  const rnd = rng(Date.now() % 100000);
  const best = (cands) => { let top = null, sc = 0; shuffle(cands, Math.floor(rnd() * 1e6)).forEach(c => { const v = haveScore(c); if (v > sc) { sc = v; top = c; } }); return { id: top, sc }; };

  days.forEach(d => {

      const group = (cenCat === 'uova' || cenCat === 'veg' || cenCat === 'formaggio') ? ['uova','veg','formaggio'] : [cenCat];
      const b = best(byType('cen').filter(c => group.includes(R[c].cat) && !used.has(c)));
      if (b.id && b.sc > haveScore(m.cen)) { S.swaps[k + ':cen'] = b.id; used.add(b.id); cenCat = R[b.id].cat; changed++; } else used.add(m.cen);
    }
    if (!['lpz','ffe','fle'].includes(m.pra)) {
      const b = best(byType('pra').filter(c => !used.has(c) && R[c].cat !== cenCat));
      if (b.id && b.sc > haveScore(m.pra)) { S.swaps[k + ':pra'] = b.id; used.add(b.id); changed++; } else used.add(m.pra);
    }
    const bc = best(byType('col').filter(c => !used.has(c)));
    if (bc.id && bc.sc > haveScore(m.col)) { S.swaps[k + ':col'] = bc.id; used.add(bc.id); changed++; }
    if (R[m.spu] && R[m.spu].t === 'spm') { const bs = best(byType('spm').filter(c => !used.has(c))); if (bs.id && bs.sc > haveScore(m.spu)) { S.swaps[k + ':spu'] = bs.id; used.add(bs.id); changed++; } }
    if (R[m.mer] && R[m.mer].t === 'mer') { const bm = best(byType('mer').filter(c => !used.has(c))); if (bm.id && bm.sc > haveScore(m.mer)) { S.swaps[k + ':mer'] = bm.id; used.add(bm.id); changed++; } }
  });
  save();

}

async function shrinkImage(file){

/* ---------------- Riepilogo settimanale ---------------- */
function weekStats(monday){
  const days = [...Array(7)].map((_, i) => keyOf(addDays(monday, i)));
  const t0 = monday.getTime(), t1 = addDays(monday, 7).getTime();
  const pesiW = S.pesi.filter(w => w.d >= days[0] && w.d <= days[6]);
  const prev = S.pesi.filter(w => w.d < days[0]);
  const pesoFine = pesiW.length ? pesiW[pesiW.length - 1].kg : null, pesoPrima = prev.length ? prev[prev.length - 1].kg : null;
  let fatti = 0; days.forEach(k => activeSlots().forEach(s => { if (S.fatti[k + ':' + s]) fatti++; }));
  const bev = days.map(k => S.bevande[k]).filter(Boolean);
  const media = (arr, f) => arr.length ? arr.reduce((a, x) => a + (x[f] || 0), 0) / arr.length : null;
  const fame = S.fame.filter(f => f.t >= t0 && f.t < t1), stress = (S.stress || []).filter(f => f.t >= t0 && f.t < t1);
  const panc = days.map(k => S.pancia[k]).filter(Boolean);
  return { days, pesoFine, pesoPrima, fatti, acqua: media(bev, 'acqua'), gas: media(bev, 'gas'), bevGiorni: bev.length, fame: fame.length, stress: stress.length, stressOk: stress.filter(x => x.preso === 'niente').length, alcolStress: stress.filter(x => x.preso === 'birra' || x.preso === 'vino').length, pancia: panc.length ? panc.reduce((a, x) => a + x.v, 0) / panc.length : null, panciaGiorni: panc.length, feste: days.filter(k => S.feste[k]).length };
}
function weekTip(w){
  if (w.fatti < 18) return 'Segna i pasti mangiati con il cerchio: anche solo farlo aiuta a seguire il piano.';
  if (w.acqua != null && w.acqua < 6) return 'Punta sull\'acqua: una bottiglia da mezzo litro sempre con te, e bevi prima di ogni pasto.';
  if (w.gas != null && w.gas > gasLimit()) return 'Coca Zero sopra il limite: tienine in frigo solo il numero di lattine della settimana.';
  if (w.fame >= 5) return 'Raptus frequenti: guarda in "Ho fame" a che ora arrivano e tieni pronta la merenda proprio per quel momento.';
  if (w.alcolStress >= 2) return 'Lo stress è finito nel bicchiere un paio di volte: prova la birra analcolica per le sere in casa.';
  if (w.pancia != null && w.pancia >= 1.2) return 'Pancia spesso gonfia: questa settimana meno bollicine e mangia più piano, poi confronta.';
  return 'Settimana solida. Tieni lo stesso ritmo: è la costanza che porta al traguardo.';
}

function paceNeeded(fromWeight, fromDate, target, goalDate){
  const weeks = (goalDate - fromDate) / (7 * 864e5);
  if (weeks <= 0) return Infinity;
  return Math.max(0, fromWeight - target) / weeks;
}
function paceMsg(pace){
  if (!isFinite(pace)) return { cls:'o', txt:'La data obiettivo è già passata: impostane una nuova in Impostazioni.' };
  if (pace > 1.05) return { cls:'o', txt:'Ritmo troppo veloce: ' + fmtKg(pace) + ' kg a settimana non è sicuro (massimo consigliato circa 1 kg). Sposta in avanti la data obiettivo o abbassa l\'obiettivo di peso.' };
  if (pace > 0.75) return { cls:'o', txt:'Ritmo impegnativo: ' + fmtKg(pace) + ' kg a settimana. Si può fare, ma servono piano seguito alla lettera, niente jolly e più movimento. Valuta di spostare un po\' la data.' };
  if (pace < 0.25) return { cls:'', txt:'Ritmo molto tranquillo: ' + fmtKg(pace) + ' kg a settimana. Ottimo per non riprenderli.' };
  return { cls:'', txt:'Ritmo sostenibile: ' + fmtKg(pace) + ' kg a settimana.' };
}

function chartSvg(start, wed, pace){
  const p = S.profilo, W = 340, H = 180, padL = 34, padR = 10, padT = 10, padB = 24;
  const t0 = start.getTime(), t1 = wed.getTime();
  const maxKg = Math.max(p.pesoIniziale, ...S.pesi.map(x => x.kg)) + 1, minKg = p.pesoTarget - 2;
  const X = (t) => padL + (t - t0) / (t1 - t0) * (W - padL - padR);
  const Y = (kg) => padT + (maxKg - kg) / (maxKg - minKg) * (H - padT - padB);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Grafico del peso: linea tratteggiata obiettivo, punti verdi le pesate">';
  for (let kg = Math.ceil(minKg / 5) * 5; kg <= maxKg; kg += 5) s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(kg) + '" y2="' + Y(kg) + '" stroke="#E1E6E2"/><text x="' + (padL - 6) + '" y="' + (Y(kg) + 4) + '" font-size="10" fill="#5B655F" text-anchor="end">' + kg + '</text>';
  s += '<line x1="' + X(t0) + '" y1="' + Y(p.pesoIniziale) + '" x2="' + X(t1) + '" y2="' + Y(p.pesoTarget) + '" stroke="#C2581A" stroke-width="2" stroke-dasharray="5 5"/>';
  s += '<text x="' + (W - padR) + '" y="' + (Y(p.pesoTarget) - 6) + '" font-size="10" fill="#8A3A0E" text-anchor="end">' + p.pesoTarget + ' kg</text>';
  const now = Date.now();
  if (now > t0 && now < t1) s += '<line x1="' + X(now) + '" x2="' + X(now) + '" y1="' + padT + '" y2="' + (H - padB) + '" stroke="#C9D3CD"/><text x="' + X(now) + '" y="' + (H - 8) + '" font-size="10" fill="#5B655F" text-anchor="middle">oggi</text>';
  s += '<text x="' + padL + '" y="' + (H - 8) + '" font-size="10" fill="#5B655F">' + MESI[start.getMonth()].slice(0, 3) + '</text><text x="' + (W - padR) + '" y="' + (H - 8) + '" font-size="10" fill="#5B655F" text-anchor="end">' + MESI[wed.getMonth()].slice(0, 3) + '</text>';
  const pts = S.pesi.map(w => [X(Math.min(t1, Math.max(t0, parseKey(w.d).getTime()))), Y(w.kg)]);
  const all = [[X(t0), Y(p.pesoIniziale)]].concat(pts);
  if (all.length > 1) s += '<polyline fill="none" stroke="#2F7D5B" stroke-width="2.5" stroke-linejoin="round" points="' + all.map(q => q.join(',')).join(' ') + '"/>';
  all.forEach(q => { s += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="4" fill="#2F7D5B" stroke="#fff" stroke-width="1.5"/>'; });
  return s + '</svg>';
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, [data-close-bg], input[type=checkbox]');
  if (!t) return;
  const d = t.dataset;
  if (d.closeBg !== undefined && e.target === t) { closeSheet(); return; }
  if (d.close !== undefined) { closeSheet(); return; }
  if (d.tab) { go(d.tab); return; }
  if (d.go) { go(d.go); return; }
  if (d.recipe) { openRecipe(d.recipe, d.date, d.slot); return; }
  if (d.swap) { swapMeal(parseKey(d.date), d.swap); if (d.closeAfter !== undefined) { const m = mealsFor(parseKey(d.date))[d.swap]; openRecipe(m, d.date, d.swap); } render(); return; }
  if (d.done) { const k = d.date + ':' + d.done; if (S.fatti[k]) delete S.fatti[k]; else S.fatti[k] = true; save(); render(); return; }
  if (d.festa !== undefined) { if (d.festa) S.feste[d.day] = d.festa; else delete S.feste[d.day]; save(); render(); if (d.festa) toast('Buona festa! Il pasto ' + (d.festa === 'pranzo' ? 'della sera' : 'di mezzogiorno') + ' è leggero.'); return; }

  if (d.sel) { selDay = Number(d.sel); render(); return; }
  if (d.week) { selWeekOffset = Math.max(-4, Math.min(4, selWeekOffset + Number(d.week))); selDay = null; render(); return; }
  if (d.pizza) {
    const monday = addDays(mondayOf(new Date()), selWeekOffset * 7), mk = keyOf(monday);

  if (d.kind) { F.kind = F.kind === d.kind ? null : d.kind; render(); return; }

    S.fame.push({ t: Date.now(), kind: F.kind || '', level: F.level, ctx: F.ctx.slice() });
    if (S.fame.length > 600) S.fame = S.fame.slice(-600);

      else if (res.data && res.data.session) { sbUser = res.data.session.user; sbMsg = ''; await sbPull(); toast('Collegato: i dati si salvano online'); }

  if (d.sbout !== undefined) { try { await sb.auth.signOut(); } catch (err) {} sbUser = null; openSettings(); render(); toast('Uscito: i dati restano sul telefono'); return; }
  if (d.fav) { const id = d.fav; if (S.pref[id]) delete S.pref[id]; else { S.pref[id] = true; delete S.escl[id]; } clearPlans(); save(); render(); openRecipe(id, d.date || null, d.slot || null); toast(S.pref[id] ? 'Aggiunto ai preferiti' : 'Tolto dai preferiti'); return; }
  if (d.escl) {
    const id = d.escl;
    if (S.escl[id]) { delete S.escl[id]; clearPlans(); save(); render(); openRecipe(id, d.date || null, d.slot || null); toast('Rimesso nel menu'); return; }
    S.escl[id] = true; delete S.pref[id];
    Object.keys(S.swaps).forEach(k => { if (S.swaps[k] === id) delete S.swaps[k]; });
    clearPlans(); save(); closeSheet(); render(); toast('Non lo vedrai più nel menu'); return;
  }
  if (d.unescl) { delete S.escl[d.unescl]; clearPlans(); save(); t.remove(); render(); toast('Rimesso nel menu'); return; }
  if (d.sost) { askSost(d.sost); return; }
  if (d.guida !== undefined) { openGuida(); return; }
  if (d.noingr) { openNoIngr(d.noingr); return; }
  if (d.pickpra && d.date) { S.swaps[d.date + ':pra'] = d.pickpra; save(); closeSheet(); render(); toast('Pranzo di domani: ' + R[d.pickpra].n); return; }
  if (d.casaopen !== undefined) { casaMsg = ''; openCasa(); return; }
  if (d.casa) { if (S.casa[d.casa]) delete S.casa[d.casa]; else S.casa[d.casa] = true; save(); openCasa(true); return; }
  if (d.casaclear !== undefined) { S.casa = {}; save(); casaMsg = ''; openCasa(); render(); return; }
  if (d.casaplan) {
    if (!casaCount()) { casaMsg = 'Prima segna almeno qualche ingrediente.'; openCasa(); return; }
    const days = casaDays(d.casaplan), n = planFromCasa(days);
    if (d.casaplan === 'prossima') { selWeekOffset = 1; selDay = 0; } else { selWeekOffset = 0; selDay = dow(days[0]); }
    tab = 'settimana'; render(); openCasaRisultato(days);
    return;
  }
  if (d.riep !== undefined) { openRiepilogo(Number(d.riep)); return; }
  if (d.report !== undefined) { openReport(); return; }
  if (d.print !== undefined) { $('#print').innerHTML = reportHtml(); try { window.print(); } catch (err) { toast('Stampa non disponibile qui: usa "Copia il testo"'); } return; }
  if (d.copyreport !== undefined) { const tmp = document.createElement('div'); tmp.innerHTML = reportHtml(); const txt = (tmp.innerText || tmp.textContent || '').trim(); try { await navigator.clipboard.writeText(txt); toast('Riepilogo copiato'); } catch (err) { toast('Copia non riuscita su questo dispositivo'); } return; }
  if (t.id === 'addvita') { const v = parseFloat(String($('#vita').value).replace(',', '.')); if (!(v > 50 && v < 200)) { toast('Scrivi il giro vita in cm, es. 108'); return; } const k = keyOf(new Date()); S.vita = (S.vita || []).filter(x => x.d !== k).concat([{ d: k, cm: v }]).sort((a, b) => a.d < b.d ? -1 : 1); save(); render(); toast('Giro vita salvato'); return; }
  if (d.drink) {
    const k = keyOf(new Date()), b = Object.assign({ acqua:0, gas:0, caffe:0 }, S.bevande[k] || {});
    b[d.drink] = Math.max(0, Math.min(30, (b[d.drink] || 0) + Number(d.delta)));
    S.bevande[k] = b; save(); render(); return;
  }
  if (d.pancia !== undefined && d.day) {
    const k = d.day, prev = S.pancia[k];
    S.pancia[k] = { v: Number(d.pancia), c: prev ? prev.c : autoCause(k) };
    save(); render(); return;
  }
  if (d.causa && d.day) {
    const e = S.pancia[d.day]; if (!e) return;
    e.c = (e.c || []).includes(d.causa) ? e.c.filter(x => x !== d.causa) : (e.c || []).concat([d.causa]);
    save(); render(); return;
  }
  if (d.panciatips !== undefined) { openPanciaTips(); return; }
  if (d.stress !== undefined) { ST.valvola = null; openStress(); return; }
  if (d.breath !== undefined) { ST.breathStart = Date.now(); ST.breathEnd = Date.now() + 60000; openStress(); return; }
  if (d.valv) { ST.valvola = ST.valvola === d.valv ? null : d.valv; const keep = $('#newvalv') ? $('#newvalv').value : ''; openStress(); if ($('#newvalv')) $('#newvalv').value = keep; return; }
  if (d.addvalv !== undefined) { const v = ($('#newvalv').value || '').trim().slice(0, 40); if (!v) return; S.valvole = valvole().concat([v]); ST.valvola = v; save(); openStress(); return; }
  if (d.preso) {
    S.stress = (S.stress || []).concat([{ t: Date.now(), valvola: ST.valvola || '', preso: d.preso }]).slice(-400);
    save(); closeSheet(); ST = { valvola:null, breathEnd:0, breathStart:0 }; render();
    toast(d.preso === 'niente' ? 'Grande! Una volta in più senza cibo né alcol.' : 'Segnato. Capita: conta la prossima volta.');
    return;
  }
  if (d.stoptimer !== undefined) { F.timerEnd = 0; render(); return; }
  if (d.jolly !== undefined) { const mk = keyOf(mondayOf(new Date())); S.jolly[mk] = (S.jolly[mk] || 0) + 1; save(); toast('Jolly usato: goditi il pezzo di pizza, salta la merenda di oggi.'); render(); return; }
  if (d.rmphoto !== undefined) { if (menuPhotoUrl) URL.revokeObjectURL(menuPhotoUrl); menuPhoto = null; menuPhotoUrl = ''; render(); return; }
  if (d.posto) { posto = posto === d.posto ? null : d.posto; render(); return; }
  if (t.id === 'aibtn') { askCoach(); return; }
  if (t.id === 'addkg') {
    const v = parseFloat(String($('#kg').value).replace(',', '.'));
    if (!(v > 40 && v < 250)) { toast('Scrivi il peso in kg, es. 101,4'); return; }
    const k = keyOf(new Date());
    const ex = S.pesi.find(w => w.d === k);
    if (ex) ex.kg = v; else S.pesi.push({ d: k, kg: v });
    S.pesi.sort((a, b) => a.d < b.d ? -1 : 1);
    save(); render(); toast('Pesata salvata'); return;
  }
  if (d.delkg) { S.pesi.splice(Number(d.delkg), 1); save(); render(); return; }
  if (t.id === 'savechol') { const v = parseInt($('#chol').value, 10); if (v > 80 && v < 500) { if (!S.chol || !S.chol.length) S.chol = S.profilo.colesterolo ? [{ d: S.profilo.inizio || keyOf(new Date()), v: S.profilo.colesterolo }] : []; S.chol.push({ d: keyOf(new Date()), v }); S.profilo.colesterolo = v; save(); render(); toast('Valore aggiornato'); } return; }
  if (d.fase) { S.fase = d.fase; S.manteniDal = d.fase === 'mantenimento' ? keyOf(new Date()) : null; save(); render(); return; }
  if (d.settings !== undefined) { openSettings(); return; }
  if (d.pool) { const i = Number(d.pool); const a = S.profilo.piscina; S.profilo.piscina = a.includes(i) ? a.filter(x => x !== i) : a.concat([i]).sort(); t.classList.toggle('on'); save(); Object.keys(planCache).forEach(k => delete planCache[k]); return; }
  if (t.id === 'st-save') {
    if (applySettings(true) === false) return;
    closeSheet(); render();
    { const p = S.profilo, pm = paceMsg(paceNeeded(lastWeight(), new Date(), p.pesoTarget, parseKey(p.matrimonio))); toast(pm.cls ? 'Salvato. Attenzione: ' + pm.txt.split(':')[0].toLowerCase() : 'Salvato: menu, tappe e grafico aggiornati'); }
    return;
  }
  if (t.id === 'su-save') {
    const p = S.profilo, num = (id) => parseFloat(String($(id).value).replace(',', '.'));
    const peso = num('#su-peso'), tg = num('#su-target'), data = $('#su-data').value;
    if (!(peso > 40 && peso < 250)) { toast('Scrivi il peso di oggi in kg'); return; }
    if (!(tg > 40 && tg < peso)) { toast('Il peso obiettivo deve essere più basso di quello di oggi'); return; }

    p.eta = parseInt($('#su-eta').value, 10) || null; p.altezza = parseInt($('#su-alt').value, 10) || null;
    p.pesoIniziale = peso; p.pesoTarget = tg; p.matrimonio = data; p.inizio = keyOf(new Date());
    p.pizzaDay = Number($('#su-pizza').value); p.compagnaCeliaca = $('#su-gf').checked;
    const ch = parseInt($('#su-chol').value, 10); p.colesterolo = (ch > 80 && ch < 500) ? ch : null;
    S.pesi = [{ d: keyOf(new Date()), kg: peso }];
    Object.keys(planCache).forEach(k => delete planCache[k]);
    save(); render(); toast('Si parte!'); return;
  }
  if (t.id === 'su-restore' || t.id === 'st-restore') {
    const raw = ($(t.id === 'su-restore' ? '#su-backup' : '#st-backup').value || '').trim();
    try { const obj = JSON.parse(raw); if (!obj || !obj.profilo) throw 0; merge(obj); Object.keys(planCache).forEach(k => delete planCache[k]); save(); closeSheet(); render(); toast('Backup ripristinato'); }
    catch (err) { toast('Backup non valido: copialo di nuovo per intero'); }
    return;
  }
  if (t.id === 'st-copy') { try { await navigator.clipboard.writeText(JSON.stringify(S)); toast('Backup copiato'); } catch (err) { toast('Copia non riuscita su questo dispositivo'); } return; }
});
document.addEventListener('input', (e) => { if (e.target && (e.target.id === 'st-wed' || e.target.id === 'st-target')) updatePacePreview(); });

  if (e.target && (e.target.id === 'st-wed' || e.target.id === 'st-target')) updatePacePreview();

}
})();
