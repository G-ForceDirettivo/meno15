ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}

.day.pool{background:var(--blue-l);color:var(--blue-d)}
.day.pz{background:var(--orange);color:#fff}

.tip.o{background:var(--orange-l);color:#7A320B}
.tip svg{flex-shrink:0;margin-top:1px}
.bigtimer{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;text-align:center}
.small{font-size:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}

.hbars i.hi{background:var(--orange)}

<script>

/* ---------------- Niente zoom (doppio tocco e pizzico) ---------------- */
(function(){
  let last = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    const t = e.target;
    const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
    if (!typing && now - last < 350) e.preventDefault();
    last = now;
  }, { passive: false });
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){ document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive: false }); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive: false });
})();

/* ---------------- Utility ---------------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => (n < 10 ? '0' : '') + n;
const keyOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };

function shuffle(arr, seed){ const r = rng(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const BAL = [

  const cnt = {}; let rossa = 0, n = 0;

    const d = addDays(monday, i), k = keyOf(d), m = mealsFor(d);

      let id = m[sl]; if (ov && ov.key === k + ':' + sl) id = ov.id; const c = mainCat(id); if (!c) return; cnt[c] = (cnt[c] || 0) + 1; if (ROSSA.includes(id)) rossa++; n++; });

function balScore(b){ let v = 0; BAL.forEach(x => { const c = b.cnt[x.c] || 0; if (c < x.min) v += x.min - c; if (c > x.max) v += c - x.max; }); if (b.rossa > 1) v += b.rossa - 1; return v; }

function merPool(){ const all = byType('mer'), p = MER_SAZ.filter(k => all.includes(k)); return p.length >= 2 ? p : all; }
function basePlan(monday){

  const mers = shuffle(merPool(), seed + 7);
  const sp = spmPool(), spProt = sp.filter(k => SPM_PROT.includes(k));

  const pres = shuffle(byType('pre'), seed + 9);
  const sers = shuffle(byType('ser'), seed + 11);
  let mains;
  if (keyOf(monday) < NUOVO_PIANO) mains = basePlanV1(monday).map(d => ({ pra: d.pra, cen: d.cen }));

    const days = []; for (let i = 0; i < 7; i++) if (i !== pz) days.push(i);

    let cenCats = ['pesce','pesce','carne','carne','legumi','leggero'];
    let praCats = ['legumi','legumi','legumi','pesce','carne','uova'];
    if (days.length === 7) { cenCats.push('pesce'); praCats.push('legumi'); }
    cenCats = shuffle(cenCats, seed + 21);
    let pr = null;
    for (let t = 0; t < 300 && !pr; t++) { const c = shuffle(praCats, seed + 31 + t); if (c.every((x, j) => x !== cenCats[j] && !(x === 'uova' && cenCats[j] === 'leggero'))) pr = c; }

      if (!list.length) list = all;

      const id = ok[0] || list.find(k => !(rossa >= 1 && ROSSA.includes(k))) || list[0];

function panciaAnalysis(){
  const keys = Object.keys(S.pancia).sort().slice(-42);
  if (keys.length < 7) return { n: keys.length, top: [] };
  const res = CAUSE.map(c => {
    const withC = keys.filter(k => (S.pancia[k].c || []).includes(c)), without = keys.filter(k => !(S.pancia[k].c || []).includes(c));
    if (withC.length < 2 || !without.length) return null;
    const avg = (arr) => arr.reduce((a, k) => a + S.pancia[k].v, 0) / arr.length;
    return { c, diff: avg(withC) - avg(without), n: withC.length };
  }).filter(x => x && x.diff >= 0.4).sort((a, b) => b.diff - a.diff);
  return { n: keys.length, top: res.slice(0, 2) };
}

  if (!cn.length) return null;
  if (cn.some(x => co.includes(x))) return { ok:true, txt:'Sì, è lo stesso ingrediente: va benissimo.' };

    }
  }
  const ga = co.map(gruppiOf).flat()[0], gb = cn.map(gruppiOf).flat()[0];
  return { ok:false, txt:'Non è una sostituzione equivalente: ' + orig.toLowerCase() + (ga ? ' fa parte di ' + ga.n : '') + ', ' + nuovo.toLowerCase() + (gb ? ' di ' + gb.n : '') + ', e cambia l\'equilibrio del piatto.' + (ga ? ' Scegli piuttosto tra: ' + ga.k.filter(x => !co.includes(x)).slice(0, 4).join(', ').toLowerCase() + '.' : ''), dubbio:true };
}

    h += '</div>';

const SLOT_KCAL = { col:350, spu:90, pra:550, mer:175, cen:550, ser:80 };
const VOTO = { bene:['Va bene','#E3F4EC','#0B5F3A'], cosi:['Così così','#FFF1D6','#7A4B00'], fuori:['Fuori piano','#FDE3DC','#8A3A0E'] };

const COMP_KCAL = { carbo:150, merleggera:80, noser:80, noolio:80 };
const CAT_LBL = { carne:'Carne', pesce:'Pesce', legumi:'Legumi', uova:'Uova', formaggio:'Formaggio', veg:'Solo verdure / niente', fuori:'Pizza o pasto libero' };

function plannedKcal(date, slot){
  let v = SLOT_KCAL[slot] || 300;
  const m = mealsFor(date);
  if (slot === 'cen' && S.profilo.piscina.includes(dow(date)) && !['dpz','ffe','fle'].includes(m.cen)) v += 100;
  if (m[slot] === 'dpz') v = 1000;
  if (m[slot] === 'ffe') v = 1100;
  if (m[slot] === 'lpz' || m[slot] === 'fle') v = 400;
  return v;
}
function nextSlots(dateKey, slot){
  const out = [], d0 = parseKey(dateKey);
  for (let g = 0; g < 2; g++) {
    const d = addDays(d0, g), k = keyOf(d), m = mealsFor(d);
    activeSlots().forEach(sl => {
      if (g === 0 && SLOTS.indexOf(sl) <= SLOTS.indexOf(slot)) return;
      if (S.mangiato[k + ':' + sl] || S.fatti[k + ':' + sl]) return;
      if (['dpz','ffe','lpz','fle'].includes(m[sl])) return;
      out.push({ k, sl, d });
    });
  }
  return out;
}
// piano di compensazione: mai saltare pasti, mai toccare colazione e spuntino, massimo 500 kcal
function compPlan(dateKey, slot, extra){
  if (extra <= 150) return { azioni: [], coperte: 0, resto: Math.max(0, extra) };
  const cap = Math.min(extra, 500), azioni = [];
  let tot = 0;
  const slots = nextSlots(dateKey, slot).filter(x => !(S.comp[x.k + ':' + x.sl] && S.comp[x.k + ':' + x.sl].da !== dateKey + ':' + slot));
  const order = [];
  slots.forEach(x => { if (x.sl === 'ser') order.push([x, 'noser']); });
  slots.forEach(x => { if (x.sl === 'pra' || x.sl === 'cen') order.push([x, 'carbo']); });
  slots.forEach(x => { if (x.sl === 'mer' && !S.profilo.piscina.includes(dow(x.d))) order.push([x, 'merleggera']); });
  const used = new Set();
  for (const [x, az] of order) {
    if (tot >= cap - 40) break;
    if (used.has(x.k + ':' + x.sl)) continue;
    used.add(x.k + ':' + x.sl); azioni.push({ k: x.k, sl: x.sl, az }); tot += COMP_KCAL[az];
  }
  // in ordine di orario, al massimo 4 interventi
  azioni.sort((a, b) => (a.k + SLOTS.indexOf(a.sl)).localeCompare(b.k + SLOTS.indexOf(b.sl)));
  return { azioni: azioni.slice(0, 4), coperte: Math.min(tot, cap), resto: Math.max(0, extra - Math.min(tot, cap)) };
}
function quando(k, sl){
  const oggi = keyOf(new Date()), dom = keyOf(addDays(new Date(), 1));
  return (SLOTNAME[sl] || sl).toLowerCase() + ' di ' + (k === oggi ? 'oggi' : k === dom ? 'domani' : GIORNI[dow(parseKey(k))].toLowerCase());
}
// riequilibra le proteine sui pasti che mancano in settimana
function riequilibra(dateKey, slot, apply){
  const d0 = parseKey(dateKey), mon = mondayOf(d0), cambi = [];
  const futuri = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), k = keyOf(d);
    if (k < dateKey) continue;
    ['pra','cen'].forEach(sl => {
      if (k === dateKey && SLOTS.indexOf(sl) <= SLOTS.indexOf(slot)) return;
      if (S.mangiato[k + ':' + sl] || S.fatti[k + ':' + sl] || S.feste[k]) return;
      const id = mealsFor(d)[sl]; if (!mainCat(id)) return;
      futuri.push({ k, sl, d });
    });
  }
  const saved = JSON.stringify(S.swaps);
  for (let it = 0; it < 3; it++) {
    const now = balScore(weekBalance(mon)); if (!now) break;
    let best = null, bs = now;
    futuri.forEach(x => {
      if (cambi.some(c => c.k === x.k && c.sl === x.sl)) return;
      const other = mainCat(mealsFor(x.d)[x.sl === 'pra' ? 'cen' : 'pra']);
      byType(x.sl).forEach(c => {
        if (other && R[c].cat === other) return;
        const sc = balScore(weekBalance(mon, { key: x.k + ':' + x.sl, id: c }));
        if (sc < bs) { bs = sc; best = { x, c }; }
      });
    });
    if (!best) break;
    const prima = mealsFor(best.x.d)[best.x.sl];
    S.swaps[best.x.k + ':' + best.x.sl] = best.c;
    cambi.push({ k: best.x.k, sl: best.x.sl, da: prima, a: best.c });
  }
  if (!apply) S.swaps = JSON.parse(saved);
  return cambi;
}
function previewAltro(dateKey, slot, kcal, cat, rossa){
  const prev = plannedKcal(parseKey(dateKey), slot), extra = (kcal || prev) - prev;
  const key = dateKey + ':' + slot;
  // simula senza toccare lo stato
  const bakM = S.mangiato[key], bakC = JSON.stringify(S.comp);
  Object.keys(S.comp).forEach(c => { if (S.comp[c].da === key) delete S.comp[c]; });
  S.mangiato[key] = { cat, rossa, kcal };
  const cp = compPlan(dateKey, slot, extra);
  const cambi = (slot === 'pra' || slot === 'cen') ? riequilibra(dateKey, slot, false) : [];
  if (bakM) S.mangiato[key] = bakM; else delete S.mangiato[key];
  S.comp = JSON.parse(bakC);
  return { prev, extra, cp, cambi };
}
function applyAltro(dateKey, slot, data){
  const key = dateKey + ':' + slot;
  Object.keys(S.comp).forEach(c => { if (S.comp[c].da === key) delete S.comp[c]; });
  const pv = previewAltro(dateKey, slot, data.kcal, data.cat, data.rossa);
  S.mangiato[key] = Object.assign({ ts: Date.now(), prev: pv.prev }, data);
  S.fatti[key] = true;
  const perche = 'extra a ' + quando(dateKey, slot);
  pv.cp.azioni.forEach(a => { S.comp[a.k + ':' + a.sl] = { az: a.az, da: key, perche }; });
  if (slot === 'pra' || slot === 'cen') riequilibra(dateKey, slot, true);
  save();
  return pv;
}
function removeAltro(dateKey, slot){
  const key = dateKey + ':' + slot;
  delete S.mangiato[key]; delete S.fatti[key];
  Object.keys(S.comp).forEach(c => { if (S.comp[c].da === key) delete S.comp[c]; });
  save();
}
function parseJsonLoose(t){
  const m = String(t || '').match(/\{[\s\S]*\}/); if (!m) return null;
  try { return JSON.parse(m[0]); } catch (e) { try { return JSON.parse(m[0].replace(/,\s*([}\]])/g, '$1')); } catch (e2) { return null; } }
}

function planFromCasa(days){

  for (let i = 0; i < 7; i++) { const d = addDays(monday, i); if (!rangeKeys.includes(keyOf(d))) { const m = mealsFor(d); SLOTS.forEach(sl => used.add(m[sl])); } }

  const best = (cands) => { let top = null, sc = 0; shuffle(cands, Math.floor(rnd() * 1e6)).forEach(c => { const v = haveScore(c); if (v > sc) { sc = v; top = c; } }); return { id: top, sc }; };

      const b = best(byType('cen').filter(c => group.includes(R[c].cat) && !used.has(c)));
      if (b.id && b.sc > haveScore(m.cen)) { S.swaps[k + ':cen'] = b.id; used.add(b.id); cenCat = R[b.id].cat; changed++; } else used.add(m.cen);
    }

      const praCat = R[m.pra] ? R[m.pra].cat : null;
      let cands = byType('pra').filter(c => !used.has(c) && R[c].cat === praCat && R[c].cat !== cenCat);
      if (!cands.length) cands = byType('pra').filter(c => !used.has(c) && R[c].cat !== cenCat && balScore(weekBalance(monday, { key: k + ':pra', id: c })) <= balScore(weekBalance(monday)));
      const b = best(cands);
      if (b.id && b.sc > haveScore(m.pra)) { S.swaps[k + ':pra'] = b.id; used.add(b.id); changed++; } else used.add(m.pra);
    }
    const bc = best(byType('col').filter(c => !used.has(c)));
    if (bc.id && bc.sc > haveScore(m.col)) { S.swaps[k + ':col'] = bc.id; used.add(bc.id); changed++; }
    if (R[m.spu] && R[m.spu].t === 'spm') { const bs = best(spmPool().filter(c => !used.has(c) && SPM_PROT.includes(c))); if (bs.id && bs.sc > haveScore(m.spu)) { S.swaps[k + ':spu'] = bs.id; used.add(bs.id); changed++; } }

  });
  save();
  return changed;
}

    h += '<div style="display:flex;align-items:baseline;gap:10px"><span style="font-family:Space Grotesk,system-ui,sans-serif;font-size:28px;font-weight:700">' + fmtKg(last) + ' cm</span>' + (v.length > 1 ? '<span class="pill' + (d > 0 ? '' : ' g') + '">' + (d > 0 ? '−' + fmtKg(d) + ' cm' : 'stabile') + '</span>' : '') + '</div>';
    if (v.length > 1) h += '<span class="small mut">Dal ' + fmtDate(parseKey(v[0].d)) + ': ' + v.map(x => fmtKg(x.cm)).join(' → ') + ' cm</span>';
  }

}

/* ---------------- Riepilogo settimanale ---------------- */
function weekStats(monday){
  const days = [...Array(7)].map((_, i) => keyOf(addDays(monday, i)));
  const t0 = monday.getTime(), t1 = addDays(monday, 7).getTime();
  const pesiW = S.pesi.filter(w => w.d >= days[0] && w.d <= days[6]);
  const prev = S.pesi.filter(w => w.d < days[0]);
  const pesoFine = pesiW.length ? pesiW[pesiW.length - 1].kg : null, pesoPrima = prev.length ? prev[prev.length - 1].kg : null;
  let fatti = 0; days.forEach(k => activeSlots().forEach(s => { if (S.fatti[k + ':' + s]) fatti++; }));
  const bev = days.map(k => S.bevande[k]).filter(Boolean);
  const media = (arr, f) => arr.length ? arr.reduce((a, x) => a + (x[f] || 0), 0) / arr.length : null;
  const fame = S.fame.filter(f => f.t >= t0 && f.t < t1), stress = (S.stress || []).filter(f => f.t >= t0 && f.t < t1);
  const panc = days.map(k => S.pancia[k]).filter(Boolean);
  return { days, pesoFine, pesoPrima, fatti, acqua: media(bev, 'acqua'), gas: media(bev, 'gas'), bevGiorni: bev.length, fame: fame.length, stress: stress.length, stressOk: stress.filter(x => x.preso === 'niente').length, alcolStress: stress.filter(x => x.preso === 'birra' || x.preso === 'vino').length, pancia: panc.length ? panc.reduce((a, x) => a + x.v, 0) / panc.length : null, panciaGiorni: panc.length, feste: days.filter(k => S.feste[k]).length };
}
function weekTip(w){
  if (w.fatti < 18) return 'Segna i pasti mangiati con il cerchio: anche solo farlo aiuta a seguire il piano.';
  if (w.acqua != null && w.acqua < 6) return 'Punta sull\'acqua: una bottiglia da mezzo litro sempre con te, e bevi prima di ogni pasto.';
  if (w.gas != null && w.gas > gasLimit()) return 'Coca Zero sopra il limite: tienine in frigo solo il numero di lattine della settimana.';
  if (w.fame >= 5) return 'Raptus frequenti: guarda in "Ho fame" a che ora arrivano e tieni pronta la merenda proprio per quel momento.';
  if (w.alcolStress >= 2) return 'Lo stress è finito nel bicchiere un paio di volte: prova la birra analcolica per le sere in casa.';
  if (w.pancia != null && w.pancia >= 1.2) return 'Pancia spesso gonfia: questa settimana meno bollicine e mangia più piano, poi confronta.';
  return 'Settimana solida. Tieni lo stesso ritmo: è la costanza che porta al traguardo.';
}
function openRiepilogo(offset){

  h += '<div class="tip">' + ICON.info + '<span><b>Per la prossima settimana:</b> ' + esc(weekTip(w)) + '</span></div>';
  sheet(h);
}

function paceNeeded(fromWeight, fromDate, target, goalDate){
  const weeks = (goalDate - fromDate) / (7 * 864e5);
  if (weeks <= 0) return Infinity;
  return Math.max(0, fromWeight - target) / weeks;
}
function paceMsg(pace){
  if (!isFinite(pace)) return { cls:'o', txt:'La data obiettivo è già passata: impostane una nuova in Impostazioni.' };
  if (pace > 1.05) return { cls:'o', txt:'Ritmo troppo veloce: ' + fmtKg(pace) + ' kg a settimana non è sicuro (massimo consigliato circa 1 kg). Sposta in avanti la data obiettivo o abbassa l\'obiettivo di peso.' };
  if (pace > 0.75) return { cls:'o', txt:'Ritmo impegnativo: ' + fmtKg(pace) + ' kg a settimana. Si può fare, ma servono piano seguito alla lettera, niente jolly e più movimento. Valuta di spostare un po\' la data.' };
  if (pace < 0.25) return { cls:'', txt:'Ritmo molto tranquillo: ' + fmtKg(pace) + ' kg a settimana. Ottimo per non riprenderli.' };
  return { cls:'', txt:'Ritmo sostenibile: ' + fmtKg(pace) + ' kg a settimana.' };
}

function viewProgressi(){
  const p = S.profilo, start = parseKey(p.inizio), wed = parseKey(p.matrimonio), today = new Date();
  const peso = lastWeight(), tot = p.pesoIniziale - p.pesoTarget;
  const weeksTot = Math.max(1, (wed - start) / (7 * 864e5));
  const pace = tot / weeksTot;
  const weeksGone = Math.max(0, (today - start) / (7 * 864e5));
  const expected = Math.max(p.pesoTarget, p.pesoIniziale - pace * weeksGone);
  const diff = peso - expected;
  let h = '<div class="top"><div><small>Obiettivo ' + p.pesoTarget + ' kg · ' + fmtDate(wed) + ' ' + wed.getFullYear() + '</small><h1>Progressi</h1></div></div>';
  h += '<div class="card stack"><span class="lab">Pesata del lunedì</span><div class="row"><input id="kg" type="text" inputmode="decimal" step="0.1" min="40" max="250" placeholder="Es. 101,4" aria-label="Peso in kg"><button class="btn pri sm" id="addkg" style="min-width:110px">Salva</button></div><span class="small mut">Al mattino, a digiuno, dopo il bagno. Una volta a settimana basta: il peso oscilla di giorno in giorno.</span></div>';
  h += '<div class="card stack"><div class="between"><span class="lab">Andamento</span><span class="small mut">ritmo previsto ' + fmtKg(pace) + ' kg/settimana</span></div>' + chartSvg(start, wed, pace) + '</div>';
  if (S.fase !== 'mantenimento' && peso > p.pesoTarget) {

    const daysLeft = Math.max(0, Math.ceil((wed - today) / 864e5));
    h += '<div class="tip' + (pm.cls ? ' o' : '') + '">' + ICON.info + '<span><b>Da oggi:</b> mancano ' + fmtKg(peso - p.pesoTarget) + ' kg in ' + daysLeft + ' giorni. ' + esc(pm.txt) + '</span></div>';

  else if (diff <= 2) status = 'Sei poco sopra il previsto (' + fmtKg(expected) + ' kg): niente panico, conta l\'andamento di 3-4 settimane.';
  else status = 'Sei sopra il previsto di ' + fmtKg(diff) + ' kg. Controlla in "Ho fame" quando arrivano i raptus e tieni fissa la merenda.';
  h += '<div class="tip">' + ICON.info + '<span>' + esc(status) + '</span></div>';

  const totKg = p.pesoIniziale - p.pesoTarget, stepKg = totKg <= 6 ? [totKg] : totKg <= 12 ? [Math.round(totKg / 2), totKg] : [Math.round(totKg / 3), Math.round(totKg * 2 / 3), totKg];
  stepKg.forEach(kg => {
    const when = addDays(start, Math.round(kg / pace * 7));
    const ok = (p.pesoIniziale - peso) >= kg;
    h += '<div class="between" style="min-height:36px"><span style="font-weight:600">' + (ok ? '<span style="color:var(--green)">' + ICON.check + '</span> ' : '') + '−' + kg + ' kg · ' + (p.pesoIniziale - kg) + ' kg</span><span class="small mut">' + (ok ? 'fatto!' : 'circa ' + MESI[when.getMonth()] + ' ' + when.getFullYear()) + '</span></div>';
  });
  h += '</div>';
  h += vitaCard();
  h += panciaProgressCard();
  h += '<div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="opt" data-riep="0" style="min-height:52px">La tua settimana</button><button class="opt" data-report style="min-height:52px">Riepilogo per il medico</button></div>';
  h += '<button class="btn sec2" data-nutri>Guida: mangiare bilanciato</button>';
  // fase
  if (S.fase === 'dimagrimento') {
    const ready = peso <= p.pesoTarget || today >= wed;
    h += '<div class="card stack"><span class="lab">Dopo il traguardo</span><span style="font-size:14px;line-height:1.5">Raggiunto l\'obiettivo, l\'app passa al <b>mantenimento</b>: le porzioni aumentano poco alla volta, ogni 2 settimane, finché il peso resta stabile. È il modo per non riprendere i chili.</span>';
    h += '<button class="btn ' + (ready ? 'pri' : 'sec2') + '" data-fase="mantenimento">' + (ready ? 'Passa al mantenimento' : 'Passa al mantenimento (in anticipo)') + '</button></div>';
  } else {

    h += '<span class="small mut">Se il peso sale oltre ' + (p.pesoTarget + 2) + ' kg per due pesate di fila, torna ai pasti base per 2 settimane.</span>';

    S.pesi.slice().reverse().slice(0, 12).forEach((w, idx) => { const realIdx = S.pesi.length - 1 - idx; h += '<div class="ing"><b>' + fmtDate(parseKey(w.d)) + '</b><span>' + fmtKg(w.kg) + ' kg <button class="btn sec2 sm" style="min-height:32px;padding:0 10px;margin-left:8px" data-delkg="' + realIdx + '" aria-label="Elimina pesata">✕</button></span></div>'; });
    h += '</div>';
  }
  h += '<button class="btn sec2" data-settings>Impostazioni e dati</button>';
  return h;
}
function chartSvg(start, wed, pace){
  const p = S.profilo, W = 340, H = 180, padL = 34, padR = 10, padT = 10, padB = 24;
  const t0 = start.getTime(), t1 = wed.getTime();
  const maxKg = Math.max(p.pesoIniziale, ...S.pesi.map(x => x.kg)) + 1, minKg = p.pesoTarget - 2;
  const X = (t) => padL + (t - t0) / (t1 - t0) * (W - padL - padR);
  const Y = (kg) => padT + (maxKg - kg) / (maxKg - minKg) * (H - padT - padB);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Grafico del peso: linea tratteggiata obiettivo, punti verdi le pesate">';
  for (let kg = Math.ceil(minKg / 5) * 5; kg <= maxKg; kg += 5) s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(kg) + '" y2="' + Y(kg) + '" stroke="#E1E6E2"/><text x="' + (padL - 6) + '" y="' + (Y(kg) + 4) + '" font-size="10" fill="#5B655F" text-anchor="end">' + kg + '</text>';
  s += '<line x1="' + X(t0) + '" y1="' + Y(p.pesoIniziale) + '" x2="' + X(t1) + '" y2="' + Y(p.pesoTarget) + '" stroke="#C2581A" stroke-width="2" stroke-dasharray="5 5"/>';
  s += '<text x="' + (W - padR) + '" y="' + (Y(p.pesoTarget) - 6) + '" font-size="10" fill="#8A3A0E" text-anchor="end">' + p.pesoTarget + ' kg</text>';
  const now = Date.now();
  if (now > t0 && now < t1) s += '<line x1="' + X(now) + '" x2="' + X(now) + '" y1="' + padT + '" y2="' + (H - padB) + '" stroke="#C9D3CD"/><text x="' + X(now) + '" y="' + (H - 8) + '" font-size="10" fill="#5B655F" text-anchor="middle">oggi</text>';
  s += '<text x="' + padL + '" y="' + (H - 8) + '" font-size="10" fill="#5B655F">' + MESI[start.getMonth()].slice(0, 3) + '</text><text x="' + (W - padR) + '" y="' + (H - 8) + '" font-size="10" fill="#5B655F" text-anchor="end">' + MESI[wed.getMonth()].slice(0, 3) + '</text>';
  const pts = S.pesi.map(w => [X(Math.min(t1, Math.max(t0, parseKey(w.d).getTime()))), Y(w.kg)]);
  const all = [[X(t0), Y(p.pesoIniziale)]].concat(pts);
  if (all.length > 1) s += '<polyline fill="none" stroke="#2F7D5B" stroke-width="2.5" stroke-linejoin="round" points="' + all.map(q => q.join(',')).join(' ') + '"/>';
  all.forEach(q => { s += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="4" fill="#2F7D5B" stroke="#fff" stroke-width="1.5"/>'; });
  return s + '</svg>';
}
function applySettings(loud){

  if (/^\d{4}-\d{2}-\d{2}$/.test(wed) && parseKey(wed) <= new Date()) { if (loud) toast('La data obiettivo deve essere nel futuro'); return false; }
  const st = parseFloat(String($('#st-start').value).replace(',', '.')), tg = parseFloat(String($('#st-target').value).replace(',', '.'));
  if (/^\d{4}-\d{2}-\d{2}$/.test(wed)) p.matrimonio = wed;
  if (/^\d{4}-\d{2}-\d{2}$/.test(ini)) p.inizio = ini;

  if ($('#st-dur')) { const du = parseInt($('#st-dur').value, 10); if (du >= 15 && du <= 240) p.durAll = du; }
  Object.keys(planCache).forEach(k => delete planCache[k]);

  return true;
}

    { const p = S.profilo, pm = paceMsg(paceNeeded(lastWeight(), new Date(), p.pesoTarget, parseKey(p.matrimonio))); toast(pm.cls ? 'Salvato. Attenzione: ' + pm.txt.split(':')[0].toLowerCase() : 'Salvato: menu, tappe e grafico aggiornati'); }
    return;
  }
  if (t.id === 'su-save') {
    const p = S.profilo, num = (id) => parseFloat(String($(id).value).replace(',', '.'));
    const peso = num('#su-peso'), tg = num('#su-target'), data = $('#su-data').value;
    if (!(peso > 40 && peso < 250)) { toast('Scrivi il peso di oggi in kg'); return; }
    if (!(tg > 40 && tg < peso)) { toast('Il peso obiettivo deve essere più basso di quello di oggi'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(data) || parseKey(data) <= new Date()) { toast('Scegli una data futura'); return; }
    p.nome = ($('#su-nome').value || '').trim().slice(0, 30);
    p.eta = parseInt($('#su-eta').value, 10) || null; p.altezza = parseInt($('#su-alt').value, 10) || null;
    p.pesoIniziale = peso; p.pesoTarget = tg; p.matrimonio = data; p.inizio = keyOf(new Date());
    p.pizzaDay = Number($('#su-pizza').value); p.compagnaCeliaca = $('#su-gf').checked;
    const ch = parseInt($('#su-chol').value, 10); p.colesterolo = (ch > 80 && ch < 500) ? ch : null;
    S.pesi = [{ d: keyOf(new Date()), kg: peso }];
    Object.keys(planCache).forEach(k => delete planCache[k]);
    save(); render(); toast('Si parte!'); return;
  }
  if (t.id === 'su-restore' || t.id === 'st-restore') {
    const raw = ($(t.id === 'su-restore' ? '#su-backup' : '#st-backup').value || '').trim();
    try { const obj = JSON.parse(raw); if (!obj || !obj.profilo) throw 0; merge(obj); Object.keys(planCache).forEach(k => delete planCache[k]); save(); closeSheet(); render(); toast('Backup ripristinato'); }
    catch (err) { toast('Backup non valido: copialo di nuovo per intero'); }
    return;
  }
  if (t.id === 'st-copy') { try { await navigator.clipboard.writeText(JSON.stringify(S)); toast('Backup copiato'); } catch (err) { toast('Copia non riuscita su questo dispositivo'); } return; }
});
document.addEventListener('input', (e) => { if (e.target && (e.target.id === 'st-wed' || e.target.id === 'st-target')) updatePacePreview(); });
document.addEventListener('change', async (e) => {
  if (e.target && e.target.id === 'al-photo' && e.target.files && e.target.files[0]) {
    const btn = $('[data-altrogo]'); const slot = btn ? btn.getAttribute('data-altrogo') : 'pra', dk = btn ? btn.getAttribute('data-date') : keyOf(new Date());
    const tx = ($('#al-text') || {}).value || '';
    alPhoto = await shrinkImage(e.target.files[0]); if (alPhotoUrl) URL.revokeObjectURL(alPhotoUrl); alPhotoUrl = URL.createObjectURL(alPhoto);
    alRes = Object.assign(alRes || {}, { text: tx, busy:false, res:null }); openAltro(slot, dk, true); return;
  }
  if (e.target && e.target.id === 'pc-photo' && e.target.files && e.target.files[0]) {
    const btn = $('[data-pcgo]'); const slot = btn ? btn.getAttribute('data-pcgo') : 'pra', dk = btn ? btn.getAttribute('data-date') : keyOf(new Date());
    const tx = ($('#pc-text') || {}).value || '';
    pcPhoto = await shrinkImage(e.target.files[0]); if (pcPhotoUrl) URL.revokeObjectURL(pcPhotoUrl); pcPhotoUrl = URL.createObjectURL(pcPhoto);
    pcRes = Object.assign(pcRes || {}, { text: tx, busy:false }); openPianoC(slot, dk, true); return;
  }
  if (e.target && (e.target.id === 'st-wed' || e.target.id === 'st-target')) updatePacePreview();
  if (e.target && /^st-(wed|inizio|start|target|pizza|gf|due|spu|ora|dur)$/.test(e.target.id || '')) { if (applySettings(false) !== false) { render(); const el = $('#st-saved'); if (el) { el.textContent = 'Salvato automaticamente'; } } }
  if (e.target && e.target.id === 'fridgephoto' && e.target.files && e.target.files[0]) { fridgePhoto(e.target.files[0]); return; }
  if (e.target && e.target.id === 'menuphoto' && e.target.files && e.target.files[0]) {
    const f = e.target.files[0];
    if (!/^image\//.test(f.type)) { toast('Serve una foto'); return; }
    menuPhoto = await shrinkImage(f);
    if (menuPhotoUrl) URL.revokeObjectURL(menuPhotoUrl);
    menuPhotoUrl = URL.createObjectURL(menuPhoto);
    aiText = ''; render();
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#layer').innerHTML) closeSheet(); });

render();
initCloud();
if (window.supabase) sbInit(); else window.addEventListener('load', sbInit);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; location.reload(); });
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { r.update().catch(() => {}); }).catch(() => {}); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); });
}
})();
